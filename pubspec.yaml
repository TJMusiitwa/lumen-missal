name: lumen_missal
description: Daily Catholic liturgical readings in a browser extension.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

dependencies:
  drift: ^2.32.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.13.1
  drift_dev: ^2.32.1

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4

flutter:

  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
